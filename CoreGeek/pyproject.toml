[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coregeek-futurewar"
version = "0.4.2"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"agent" = "src/agent"}

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["agent*", "app*"]
